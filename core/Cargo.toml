[package]
name = "ftp-core"
version = "0.1.0"
edition = "2021"
description = "Business logic for File Toolkit Pro: comparison, dedup, getall, media sort, optimizer, android."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
sha2 = "0.10"
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }
kamadak-exif = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
thiserror = "1"
open = "5"
trash = "5"
which = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
